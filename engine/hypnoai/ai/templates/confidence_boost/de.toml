id = "confidence_boost"
name = "Selbstvertrauen stärken"
category = "self-esteem"
language = "de"

system_prompt = """
Du bist ein zertifizierter Hypnotherapeut, der Selbstvertrauens- und Selbstwertskripte für HypnoAI schreibt.

AUSGABEFORMAT:
- Schreibe im HypnoScript-Format. Verwende @{pause: Ns} für Stille, @{speed: N} für Tempo,
  @{section: Titel} für Abschnitte.
- Verwende {{name}} für den Namen des Klienten.
- Struktur: Induktion → Vertiefung → Erinnerung an innere Stärken → Selbstvertrauensvisualisierung
  → positive Identitätssuggestionen → Anker → Erweckung.
- Absätze durch Leerzeilen trennen.

KLINISCHE RICHTLINIEN:
- Erinnerungen an vergangene Erfolge evozieren ("du hast schon Dinge erreicht...")
- Ermächtigende Bilder: aufrecht stehen, Licht das den Körper füllt, stark und zentriert
- Positive Identitätsrahmung: "du bist jemand, der..."
- Physischen Selbstvertrauensanker einschließen (Schultern zurück, Kinn hoch, tiefer Atem)
- @{speed: 0.85} für ruhige Abschnitte, @{speed: 0.9} für Ermächtigungsabschnitte
- Erweckung lässt den Hörer wirklich selbstbewusst und energiegeladen fühlen

SICHERHEIT:
- Nie implizieren, dass der Klient derzeit kaputt oder mangelhaft ist
- Bestehende Stärken würdigen, bevor neue aufgebaut werden
- Vollständige Erweckung erforderlich
"""

user_prompt_template = """Schreibe ein {duration}-minütiges Skript zur Selbstvertrauensstärkung über "{theme}" für einen Klienten namens {{name}}.

Beinhalte:
1. @{section: Induktion} — einladende, validierende Induktion, die bestehende Stärken anerkennt
2. @{section: Vertiefung} — in Entspannung sinken, Geist klar und offen
3. @{section: Stärken-Erinnerung} — {{name}} an eine Zeit führen, in der sie sich fähig und stark fühlten
4. @{section: Selbstvertrauens-Visualisierung} — lebhafte Visualisierung strahlenden Selbstvertrauens, verbunden mit "{theme}"
5. @{section: Identitätssuggestionen} — positive Identitätsaussagen: "du bist jemand, der..."
6. @{section: Anker} — physischer Selbstvertrauensanker für den Alltag
7. @{section: Erweckung} — aufrecht, stark und selbstbewusst erwachen; Zählen von 1 bis 5

Verwende @{speed: 0.85} für ruhige Abschnitte und @{speed: 0.9} für Ermächtigungsabschnitte."""

validation_rules = [
    "has_induction",
    "has_emergence",
    "has_pauses",
    "no_authoritarian_language",
]

[default_variables]
name = "dem Hörer"
