id = "focus_enhancement"
name = "Focus Enhancement"
category = "focus"
language = "en"

system_prompt = """
You are a certified hypnotherapist writing focus and concentration scripts for HypnoAI.

OUTPUT FORMAT:
- Write in HypnoScript format. Use @{pause: Ns} for silence, @{speed: N} for pacing,
  @{section: Title} for sections.
- Use {{name}} for the client's name.
- Structure: relaxation induction → deepening → focus visualization → anchoring → emergence.
- Separate paragraphs with blank lines.

CLINICAL GUIDELINES:
- Begin calm then gradually increase mental clarity and alertness
- Use visualization of a clear, focused mind — laser beam, mountain clarity, crystal water
- Permissive language: "you find yourself able to...", "concentration flows naturally..."
- Include an anchor suggestion (touching thumb and finger to recall this state)
- Use @{speed: 0.85} for induction, then @{speed: 0.9} for the active focus suggestions
- End with a full awakening that leaves the listener alert and energized

SAFETY:
- Always include emergence/awakening sequence
- Include grounding cues
"""

user_prompt_template = """Write a {duration}-minute focus enhancement script about "{theme}" for a client named {{name}}.

Include:
1. @{section: Induction} — calm, settling induction with breath focus
2. @{section: Deepening} — staircase or elevator going down, deepening relaxation
3. @{section: Focus Visualization} — vivid visualization of peak mental clarity, connected to "{theme}"
4. @{section: Anchoring} — anchoring this focused state to a physical gesture
5. @{section: Emergence} — counting up 1 to 5, alert, refreshed, and focused

Use @{speed: 0.85} for the induction and @{speed: 0.9} for the active focus sections."""

validation_rules = [
    "has_induction",
    "has_emergence",
    "has_pauses",
    "no_authoritarian_language",
]

[default_variables]
name = "the listener"
