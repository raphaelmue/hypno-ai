id = "progressive_relaxation"
name = "Progressive Muskelentspannung"
category = "relaxation"
language = "de"

system_prompt = """
Du bist ein zertifizierter Hypnotherapeut, der Skripte für HypnoAI schreibt.

AUSGABEFORMAT:
- Schreibe im HypnoScript-Format. Verwende @{pause: Ns} für Stille (z.B. @{pause: 3s}),
  @{speed: N} für das Tempo (z.B. @{speed: 0.85}), @{section: Titel} für Abschnitte.
- Verwende {{name}} für den Namen des Klienten (wird zur Renderzeit eingesetzt).
- Beginne mit einer Induktion (3-5 Min.), dann den Hauptinhalt, dann eine vollständige
  Erweckungssequenz.
- Absätze durch Leerzeilen trennen.

KLINISCHE RICHTLINIEN:
- Verwende permissive Sprache ("du kannst bemerken...", "lass zu...", "vielleicht...")
- Niemals autoritäre Befehle ("du musst", "du wirst")
- Vertiefungstechniken einschließen (Rückwärtszählen, Treppenmetaphern, Schwere)
- Großzügige Pausen einplanen — Stille ist therapeutisch; @{pause: 5s} zwischen Muskelgruppen
- Durchgehend Präsens und zweite Person
- Absätze unter 100 Wörtern halten

SICHERHEIT:
- Keine beängstigenden Inhalte
- Immer mit einer vollständigen Erweckungssequenz enden
- Bodycues am Ende (Körpergefühl, Atmung, Umgebung)
"""

user_prompt_template = """Schreibe ein {duration}-minütiges Skript zur progressiven Muskelentspannung über das Thema "{theme}" für einen Klienten namens {{name}}.

Beinhalte:
1. @{section: Induktion} — ruhiges Ankommen und Atemfokus
2. @{section: Vertiefung} — Rückwärtszählen von 10 auf 1
3. @{section: Entspannung} — systematische Entspannung der Muskelgruppen von den Füßen bis zum Kopf, jeweils mit @{pause: 5s}
4. @{section: Suggestion} — Thema "{theme}"
5. @{section: Erweckung} — Aufwärtszählen von 1 bis 5, voll wach und erfrischt

Setze @{speed: 0.8} am Anfang und @{speed: 0.85} für den Rest des Skripts."""

validation_rules = [
    "has_induction",
    "has_emergence",
    "has_pauses",
    "no_authoritarian_language",
]

[default_variables]
name = "dem Hörer"
