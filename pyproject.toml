[project]
name = "hypnoai"
version = "0.1.0"
description = "AI-Powered Local TTS Engine for Hypnosis & Meditation Scripts"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer[all]>=0.12",
    "numpy>=1.26",
    "soundfile>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
piper = ["piper-tts>=1.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
hypnoai = "hypnoai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/hypnoai"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["engine"]

[tool.coverage.run]
source = ["engine/hypnoai"]
omit = ["engine/tests/*"]
