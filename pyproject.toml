[project]
name = "hypnoai"
version = "0.1.0"
description = "AI-Powered Local TTS Engine for Hypnosis & Meditation Scripts"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer[all]>=0.12",
    "numpy>=1.26",
    "soundfile>=0.12",
    "rich>=13.0",
    "scipy>=1.11",
    "pyloudnorm>=0.1",
]

[project.optional-dependencies]
piper = ["piper-tts>=1.4.1", "pathvalidate>=3.3.1"]
coqui = ["coqui-tts>=0.27.5"]
kokoro = ["kokoro>=0.9.4"]
styletts = ["styletts2>=0.1.6"]
f5tts = ["f5-tts>=1.1.16"]
bark = ["bark>=0.1.5"]
pitch = ["librosa>=0.11.0"]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[project.scripts]
hypnoai = "hypnoai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/hypnoai"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["engine"]

[tool.coverage.run]
source = ["engine/hypnoai"]
omit = ["engine/tests/*"]
